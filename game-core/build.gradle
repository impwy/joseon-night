plugins {
    id 'java-library'
    id 'application'
    id 'org.springframework.boot'
}

dependencies {
    implementation enforcedPlatform("org.springframework.boot:spring-boot-dependencies:${rootProject.ext.springBootVersion}")
    implementation platform("com.linecorp.armeria:armeria-bom:${rootProject.ext.armeriaVersion}")

    api 'jakarta.validation:jakarta.validation-api'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'com.linecorp.armeria:armeria-spring-boot3-starter'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.3'

    developmentOnly "org.springframework.boot:spring-boot-docker-compose:${rootProject.ext.springBootVersion}"
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "com.tngtech.archunit:archunit-junit5:${rootProject.ext.archUnitVersion}"
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'kr.vamsur.GameCoreApplication'
}

springBoot {
    mainClass = 'kr.vamsur.GameCoreApplication'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}

tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}
